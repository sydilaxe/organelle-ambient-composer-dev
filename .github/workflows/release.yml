# Build, test in Pure Data, and package the patch.
#  - push a tag like v1.0 -> a GitHub Release with the zip attached
#  - Actions > "Release build" > Run workflow (version e.g. v0.1) -> the same: a Release with the zip
#    ("dev" makes a pre-release that is replaced each time)
# The zip goes on a Release, not a workflow artifact: Releases don't count against the Actions storage quota.
name: Release build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.0"
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Pure Data and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends puredata-core python3-numpy python3-scipy zip
          pd -version

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${{ inputs.version || 'dev' }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: tools/build.sh

      - name: Committed patch matches its source
        run: |
          if ! git diff --quiet -- patches/; then
            git status --short -- patches/
            echo "::error::patches/ is out of date - run tools/build.sh and commit the result"
            exit 1
          fi

      - name: Test in Pure Data
        working-directory: tools
        run: python3 ci_check.py

      - name: Package
        run: tools/package.sh "${{ steps.v.outputs.version }}"

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          printf '## Install\nUnzip and copy the "Amble" folder into the Organelle Patches folder.\n' > notes.md
          pre=""
          if [ "$v" = "dev" ]; then
            pre="--prerelease"
            gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          elif [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$v" >/dev/null 2>&1; then
            echo "::error::Release $v already exists - choose a new version"
            exit 1
          fi
          gh release create "$v" dist/*.zip --target "$GITHUB_SHA" --title "Amble $v" --notes-file notes.md \
            --generate-notes $pre
